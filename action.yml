name: "Terminal Screenshot"
description: "Take terminal screenshots and optionally resize them"

inputs:
  vhs-tape:
    description: "Path to the VHS .tape file"
    required: true
  resize-width:
    description: "Resize output images to this width (pixels). Set to 0 to skip resizing."
    default: "0"
  vhs-version:
    description: "VHS version to install (e.g., v0.8.0). Defaults to latest."
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Install VHS dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ffmpeg ttyd

    - uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Install VHS
      shell: bash
      run: |
        go install github.com/charmbracelet/vhs@${{ inputs.vhs-version }}
        echo "$HOME/go/bin" >> "$GITHUB_PATH"

    - name: Create output directories
      shell: bash
      run: |
        grep -i '^\(Screenshot\|Output\) ' "${{ inputs.vhs-tape }}" | awk '{print $2}' | while read -r img; do
          mkdir -p "$(dirname "$img")"
        done

    - name: Run VHS
      shell: bash
      run: vhs ${{ inputs.vhs-tape }}

    - name: Resize screenshots
      if: inputs.resize-width != '0'
      shell: bash
      run: |
        images=$(grep -i '^\(Screenshot\|Output\) ' "${{ inputs.vhs-tape }}" | awk '{print $2}')
        for img in $images; do
          ffmpeg -i "$img" -vf "scale=${{ inputs.resize-width }}:-1" -map_metadata -1 /tmp/_vhs_resized.png -y
          mv /tmp/_vhs_resized.png "$img"
        done
